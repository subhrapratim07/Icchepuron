name: Supabase Keepalive

on:
  schedule:
    # Runs every Monday and Thursday at 03:00 UTC — well under Supabase's
    # 7-day inactivity window, with margin for delays.
    - cron: '0 3 * * 1,4'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the kv_store table (counts as real DB activity)
        run: |
          curl -s -X POST \
            "${SUPABASE_URL}/rest/v1/kv_store?on_conflict=key" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{"key":"__keepalive__","value":{"pinged_at":"'"$(date -u +%FT%TZ)"'"}}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
