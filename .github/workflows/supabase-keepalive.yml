name: Supabase Keepalive

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is missing or empty. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing or empty. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secrets look present. URL host: $(echo "$SUPABASE_URL" | sed -E 's#https?://##; s#/.*##')"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Touch the kv_store table
        run: |
          curl -sS -X POST \
            "$SUPABASE_URL/rest/v1/kv_store?on_conflict=key" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"key\":\"__keepalive__\",\"value\":{\"pinged_at\":\"$(date -u +%FT%TZ)\"}}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
